openapi: 3.1.0
info:
  title: NRI Organizer API
  description: 'REST API організатора настільних рольових ігор: ігри, гравці та кімнати
    клубу. Усі відповіді — заглушки в пам''яті процесу. Для захищених операцій натисніть
    Authorize і введіть демо-токен: master-token, player-token або owner-token.'
  version: 1.0.0
servers:
- url: https://vibecoders.onrender.com
  description: Продакшн сервер
- url: http://localhost:3000
  description: Локальний сервер
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Увійти в систему
      description: 'Перевіряє пошту та пароль і повертає токен для заголовка Authorization:
        Bearer. Демо-акаунти: master@club.test / master-pass-1, player@club.test /
        player-pass-1, owner@club.test / owner-pass-1. Повідомлення про помилку однакове
        для невідомої пошти та хибного пароля. Після 5 невдалих спроб за 15 хвилин
        акаунт блокується на 15 хвилин (429, заголовок Retry-After).'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Акаунт тимчасово заблоковано після невдалих спроб входу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games:
    get:
      tags:
      - Games
      summary: Отримати список ігор
      description: 'Повертає ігри з пагінацією та фільтрами. Порядок гарантований:
        за часом початку, потім за id.'
      operationId: list_games
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Максимальна кількість ігор у відповіді
          default: 20
          title: Limit
        description: Максимальна кількість ігор у відповіді
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Скільки ігор пропустити
          default: 0
          title: Offset
        description: Скільки ігор пропустити
      - name: room_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^room_\d+$
          - type: 'null'
          description: Показати лише ігри в цій кімнаті
          title: Room Id
        description: Показати лише ігри в цій кімнаті
      - name: master_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^user_\d+$
          - type: 'null'
          description: Показати лише ігри цього майстра
          title: Master Id
        description: Показати лише ігри цього майстра
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListResponse'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Games
      summary: Створити гру
      description: Створює гру. Майстром стає автор запиту. Доступно ролям master
        та owner.
      operationId: create_game
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав для цієї дії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфлікт зі станом системи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{game_id}:
    get:
      tags:
      - Games
      summary: Отримати гру за id
      description: Повертає деталі однієї гри разом із кількістю записаних гравців.
      operationId: get_game
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^game_\d+$
          description: Ідентифікатор гри
          examples:
          - game_1
          title: Game Id
        description: Ідентифікатор гри
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Games
      summary: Повністю замінити гру
      description: Замінює всі поля гри. Усі поля тіла обов'язкові. Повторний запит
        з тим самим тілом дає той самий результат.
      operationId: replace_game
      security:
      - HTTPBearer: []
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^game_\d+$
          description: Ідентифікатор гри
          examples:
          - game_1
          title: Game Id
        description: Ідентифікатор гри
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав для цієї дії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфлікт зі станом системи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Games
      summary: Частково оновити гру
      description: Змінює лише передані поля. Порожнє тіло запиту — помилка валідації.
      operationId: patch_game
      security:
      - HTTPBearer: []
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^game_\d+$
          description: Ідентифікатор гри
          examples:
          - game_1
          title: Game Id
        description: Ідентифікатор гри
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GamePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав для цієї дії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфлікт зі станом системи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Games
      summary: Видалити гру
      description: Видаляє гру разом із записами гравців і звільняє кімнату. Доступно
        майстру гри та власнику клубу.
      operationId: delete_game
      security:
      - HTTPBearer: []
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^game_\d+$
          description: Ідентифікатор гри
          examples:
          - game_1
          title: Game Id
        description: Ідентифікатор гри
      responses:
        '204':
          description: Successful Response
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав для цієї дії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{game_id}/players:
    get:
      tags:
      - Games
      summary: Отримати список гравців гри
      description: Повертає записаних гравців та лічильник заповненості. Потрібна
        автентифікація.
      operationId: list_players
      security:
      - HTTPBearer: []
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^game_\d+$
          description: Ідентифікатор гри
          examples:
          - game_1
          title: Game Id
        description: Ідентифікатор гри
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersResponse'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Games
      summary: Записатися на гру
      description: Записує автора запиту на гру. Тіло запиту не потрібне. Помилка
        409, якщо місць немає або гравець уже записаний.
      operationId: enroll_player
      security:
      - HTTPBearer: []
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^game_\d+$
          description: Ідентифікатор гри
          examples:
          - game_1
          title: Game Id
        description: Ідентифікатор гри
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфлікт зі станом системи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/games/{game_id}/players/{user_id}:
    delete:
      tags:
      - Games
      summary: Скасувати запис гравця
      description: Скасовує запис гравця. Доступно самому гравцеві, майстру гри та
        власнику клубу.
      operationId: remove_player
      security:
      - HTTPBearer: []
      parameters:
      - name: game_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^game_\d+$
          description: Ідентифікатор гри
          examples:
          - game_1
          title: Game Id
        description: Ідентифікатор гри
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^user_\d+$
          description: Ідентифікатор гравця
          examples:
          - user_2
          title: User Id
        description: Ідентифікатор гравця
      responses:
        '204':
          description: Successful Response
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав для цієї дії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/rooms:
    get:
      tags:
      - Rooms
      summary: Отримати список кімнат
      description: Повертає кімнати клубу з пагінацією. Кімнати відсортовані за id.
      operationId: list_rooms
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Максимальна кількість кімнат у відповіді
          default: 20
          title: Limit
        description: Максимальна кількість кімнат у відповіді
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Скільки кімнат пропустити
          default: 0
          title: Offset
        description: Скільки кімнат пропустити
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/rooms/{room_id}:
    get:
      tags:
      - Rooms
      summary: Отримати кімнату за id
      description: Повертає одну кімнату клубу з її місткістю та статусом блокування.
      operationId: get_room
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^room_\d+$
          description: Ідентифікатор кімнати
          examples:
          - room_1
          title: Room Id
        description: Ідентифікатор кімнати
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Rooms
      summary: Заблокувати або розблокувати кімнату
      description: 'Доступно лише власнику клубу. Заблокувати кімнату, у якій є ігри,
        не можна: спочатку їх потрібно видалити (409).'
      operationId: patch_room
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^room_\d+$
          description: Ідентифікатор кімнати
          examples:
          - room_1
          title: Room Id
        description: Ідентифікатор кімнати
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Відсутній або недійсний токен доступу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав для цієї дії
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфлікт зі станом системи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/rooms/{room_id}/bookings:
    get:
      tags:
      - Rooms
      summary: Отримати календар бронювань кімнати
      description: Повертає слоти, у які кімната зайнята іграми, відсортовані за часом
        початку.
      operationId: list_room_bookings
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^room_\d+$
          description: Ідентифікатор кімнати
          examples:
          - room_1
          title: Room Id
        description: Ідентифікатор кімнати
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomBookingsResponse'
        '400':
          description: 'Некоректні вхідні дані: не пройшли валідацію'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Booking:
      properties:
        game_id:
          type: string
          title: Game Id
          examples:
          - game_1
        title:
          type: string
          title: Title
          examples:
          - Прокляття Страда
        master_id:
          type: string
          title: Master Id
          examples:
          - user_1
        starts_at:
          type: string
          format: date-time
          title: Starts At
          examples:
          - '2026-10-10T18:00:00Z'
        ends_at:
          type: string
          format: date-time
          title: Ends At
          examples:
          - '2026-10-10T21:00:00Z'
      type: object
      required:
      - game_id
      - title
      - master_id
      - starts_at
      - ends_at
      title: Booking
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: Машинозчитуваний код помилки
          examples:
          - VALIDATION_ERROR
        message:
          type: string
          title: Message
          description: Опис помилки для людини
          examples:
          - Вхідні дані не пройшли валідацію
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: Деталі по окремих полях
      type: object
      required:
      - code
      - message
      title: ErrorBody
    ErrorDetail:
      properties:
        field:
          type: string
          title: Field
          description: Шлях до проблемного поля
          examples:
          - body.max_players
        message:
          type: string
          title: Message
          description: Що саме не так з полем
          examples:
          - Input should be less than or equal to 8
      type: object
      required:
      - field
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
