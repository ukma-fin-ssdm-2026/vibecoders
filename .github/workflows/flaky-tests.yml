name: Flaky tests

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Number of complete test-suite runs
        type: choice
        options:
          - "5"
          - "6"
          - "8"
          - "10"
        default: "5"
        required: true

permissions:
  contents: read

jobs:
  flaky-tests:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          pip install --only-binary :all: -r src/api/requirements.txt
          pip install --only-binary :all: black==25.11.0 flake8==7.3.0 bandit==1.8.6 pytest pytest-cov

      - name: Repeat full test suite
        env:
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          [[ "$REPEATS" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p reports
          for i in $(seq 1 "$REPEATS"); do
            python -m pytest src/api/tests -p no:cacheprovider -q --junitxml="reports/run${i}.xml" || true
          done

      - name: Create flaky test report
        if: always()
        run: python scripts/flaky_report.py reports >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: reports/
