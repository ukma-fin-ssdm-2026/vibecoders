name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: [self-hosted, linux]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --only-binary :all: --upgrade pip
        pip install --only-binary :all: -r src/api/requirements.txt
        pip install --only-binary :all: black==25.11.0 flake8==7.3.0 bandit==1.8.6 pytest pytest-cov

    - name: Check formatting with Black
      run: python -m black --check src/api

    - name: Lint with Flake8
      run: python -m flake8

    - name: Security check with Bandit
      run: python -m bandit -x src/api/tests -r src/api

    - name: Check requirement traceability
      run: python scripts/check_traceability.py

    - name: Run tests with Pytest and coverage
      run: python -m pytest src/api/tests --cov=src/api --cov-report=term-missing --cov-report=html --cov-fail-under=95

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: htmlcov
        path: htmlcov/

  reliability-tests:
    runs-on: [self-hosted, linux]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install reliability-test dependencies
      run: |
        python -m pip install --only-binary :all: --upgrade pip
        pip install --only-binary :all: -r src/api/requirements.txt
        pip install --only-binary :all: pytest

    - name: Run reliability tests
      run: python -m pytest src/api/tests/reliability -v
