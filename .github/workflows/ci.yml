name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  docs_filter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}

    steps:
    - name: Checkout pull request
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect non-Markdown changes
      id: filter
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        changed_files="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"
        if printf '%s\n' "$changed_files" | grep -qvE '(^|/)[^/]+\.md$'; then
          echo "run_ci=true" >> "$GITHUB_OUTPUT"
        else
          echo "run_ci=false" >> "$GITHUB_OUTPUT"
        fi

  validate-and-test:
    needs: docs_filter
    if: ${{ always() && (github.event_name != 'pull_request' || needs.docs_filter.result != 'success' || needs.docs_filter.outputs.run_ci == 'true') }}
    runs-on: [self-hosted, linux]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --only-binary :all: --upgrade pip
        pip install --only-binary :all: -r src/api/requirements.txt
        pip install --only-binary :all: black==25.11.0 flake8==7.3.0 bandit==1.8.6 pytest pytest-cov

    - name: Check formatting with Black
      run: python -m black --check src/api

    - name: Lint with Flake8
      run: python -m flake8

    - name: Security check with Bandit
      run: python -m bandit -x src/api/tests -r src/api

    - name: Check requirement traceability
      run: python scripts/check_traceability.py

    - name: Run tests with Pytest and coverage
      run: python -m pytest src/api/tests --cov=src/api --cov-report=term-missing --cov-report=html --cov-fail-under=95

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: htmlcov
        path: htmlcov/

  reliability-tests:
    needs: docs_filter
    if: ${{ always() && (github.event_name != 'pull_request' || needs.docs_filter.result != 'success' || needs.docs_filter.outputs.run_ci == 'true') }}
    runs-on: [self-hosted, linux]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install reliability-test dependencies
      run: |
        python -m pip install --only-binary :all: \
          fastapi==0.115.12 \
          "uvicorn[standard]==0.34.2" \
          pyyaml==6.0.2 \
          httpx==0.28.1 \
          sqlalchemy==2.0.43 \
          pytest==8.4.2 \
          pytest-cov==6.2.1 \
          hypothesis==6.140.2 \
          pytest-benchmark==5.1.0

    - name: Run reliability tests
      run: python -m pytest src/api/tests/reliability -v

  publish-container:
    needs: [validate-and-test, reliability-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate-and-test.result == 'success' && needs.reliability-tests.result == 'success'
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase image name
      id: image
      env:
        REPOSITORY: ${{ github.repository }}
      run: echo "name=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Build and publish image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        push: true
        tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
        cache-from: type=gha,scope=ghcr-main
        cache-to: type=gha,mode=max,scope=ghcr-main
